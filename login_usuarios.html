<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiBar - Iniciar Sesión</title>
    
    <!-- Bootstrap 5 local -->
    <link rel="stylesheet" href="estilos_css/bootstrap.css">
    <!-- Estilos personalizados para la tipografía Arial Black -->
    <link rel="stylesheet" href="estilos_css/estilo_index.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">OptiBar</a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="login_usuarios.html">Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DEL FORMULARIO -->
    <div class="container mt-5">
        <div class="row justify-content-end">
            <!-- Columna que contiene la caja del formulario alineada a la derecha -->
            <div class="col-md-6 col-lg-5">
                <!-- Caja con borde negro sólido según tu diseño -->
                <div class="p-4 border border-2 border-dark rounded-0 bg-white">
                    
                    <h2 class="fw-bold mb-3">Iniciar Sesión</h2>
                    <p class="fs-6 mb-4">Ingresa tus datos para acceder al sistema</p>

                    <form>
                        <!-- Campo: Tipo de Documento -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Documento:</label>
                            <select class="form-select bg-light border border-secondary">
                                <option selected>Cédula de Ciudadanía</option>
                                <option value="1">Tarjeta de Identidad</option>
                                <option value="2">Cédula de Extranjería</option>
                                <option value="3">Pasaporte</option>
                            </select>
                        </div>

                        <!-- Campo: Número de documento -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Número de documento:</label>
                            <input type="number" class="form-control border border-secondary">
                        </div>

                        <!-- Campo: Password -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Password:</label>
                            <input type="password" class="form-control border border-secondary">
                        </div>

                        <!-- Enlace a Recuperar Contraseña -->
                        <div class="mb-4">
                            <a href="recuperacion_password.html" class="text-primary fw-bold text-decoration-underline">
                                Olvidé mi contraseña
                            </a>
                        </div>

                        <!-- Botón Ingresar -->
                        <div class="text-end">
                            <button type="button" class="btn btn-light border border-dark px-4 py-2 fw-bold">
                                Ingresar
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
