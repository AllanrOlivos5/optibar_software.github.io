<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiBar - Inicio</title>
    
    <!-- Enlace a Bootstrap 5 local -->
    <link rel="stylesheet" href="estilos_css/bootstrap.css">
    <!-- Enlace a tus estilos personalizados -->
    <link rel="stylesheet" href="estilos_css/estilo_index.css">
</head>
<body>

    <!-- 1. BARRA DE NAVEGACIÓN (Navbar) -->
    <!-- navbar: define la barra de navegación -->
    <!-- navbar-expand-lg: hace que el menú se adapte en pantallas grandes -->
    <!-- navbar-dark bg-dark: le da un estilo de fondo oscuro con letras claras -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            
            <!-- Logo o Nombre de la marca -->
            <a class="navbar-brand fw-bold" href="index.html">OptiBar</a>
            
            <!-- Botón desplegable para dispositivos móviles (hamburguesa) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Enlaces del menú alineados a la derecha (justify-content-end) -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <!-- Enlace que dirige al archivo de inicio de sesión que ya tienes creado en tu repositorio -->
                        <a class="nav-link" href="login_usuarios.html">Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. SECCIÓN PRINCIPAL (Hero Section) -->
    <!-- container: centra el contenido y deja márgenes a los lados -->
    <!-- mt-5: margen superior (margin-top) para separar la barra de navegación -->
    <div class="container mt-5">
        
        <!-- p-5: espacio interior grande (padding) -->
        <!-- bg-light: fondo de color claro -->
        <!-- rounded-3: esquinas redondeadas -->
        <!-- shadow-sm: añade una pequeña sombra elegante -->
        <!-- text-center: centra todo el texto horizontalmente -->
        <div class="p-5 mb-4 bg-light rounded-3 shadow-sm text-center">
            <div class="container-fluid py-5">
                
                <!-- Título principal -->
                <h1 class="display-5 fw-bold text-dark">OptiBar</h1>
                
                <!-- Eslogan oficial del proyecto extraído de la documentación -->
                <p class="fs-5 text-muted fw-semibold mb-3">Administra • Optimiza • Destaca</p>
                
                <!-- Descripción basada en la problemática y objetivos del bar "La Oficina" -->
                <p class="col-md-8 fs-5 mx-auto text-secondary">
                    Plataforma integral para la gestión de inventarios, automatización de facturación, acumulación de puntos en billetera digital y solicitud de conductor elegido para un retorno vial seguro.
                </p>
                
                <!-- Botón de llamada a la acción que lleva al login -->
                <a href="login_usuarios.html" class="btn btn-dark btn-lg mt-3">Ingresar al Sistema</a>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap 5 indispensable para que el menú de celulares funcione -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
